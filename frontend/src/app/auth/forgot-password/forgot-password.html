<div class="shell">
  <div class="card-wrap">
    <div class="brand">
      <span class="brand-mark">T</span>
      <span>Tracker</span>
    </div>

    <p-card class="auth-card">
      <ng-template #title>Forgot your password?</ng-template>
      <ng-template #subtitle>Enter your workspace and email; we'll send a reset link.</ng-template>
      <ng-template #content>
        @if (error()) { <div class="alert">{{ error() }}</div> }
        @if (message()) { <div class="alert alert-success">{{ message() }}</div> }

        <form (ngSubmit)="submit()" #f="ngForm">
          <div class="field">
            <label for="tenant">Workspace</label>
            <input pInputText id="tenant" name="tenantSlug" required
                   placeholder="e.g. acme"
                   [(ngModel)]="tenantSlug" autocomplete="organization" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input pInputText id="email" name="email" type="email" required
                   [(ngModel)]="email" autocomplete="email" />
          </div>

          <p-button label="Send reset link" icon="pi pi-send" type="submit"
                    class="submit" [loading]="submitting()"
                    [disabled]="!f.valid"></p-button>
        </form>

        <div class="foot">
          Remembered it? <a routerLink="/login">Login</a>
        </div>
      </ng-template>
    </p-card>

    <div class="back-home"><a routerLink="/">&larr; Back to home</a></div>
  </div>
</div>
