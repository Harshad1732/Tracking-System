<div class="shell">
  <div class="card-wrap">
    <div class="brand">
      <span class="brand-mark">T</span>
      <span>Tracker</span>
    </div>

    <p-card class="auth-card">
      <ng-template #title>Create your workspace</ng-template>
      <ng-template #subtitle>Each company gets its own isolated tenant.</ng-template>
      <ng-template #content>
        @if (error()) { <div class="alert">{{ error() }}</div> }

        <form (ngSubmit)="submit()" #f="ngForm">
          <div class="field">
            <label for="tenant">Company / Workspace name</label>
            <input pInputText id="tenant" name="tenantName" required
                   placeholder="e.g. Acme Manufacturing"
                   [(ngModel)]="tenantName" autocomplete="organization" />
          </div>
          <div class="field">
            <label for="fullName">Your full name</label>
            <input pInputText id="fullName" name="fullName" [(ngModel)]="fullName"
                   autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input pInputText id="email" name="email" type="email" required
                   [(ngModel)]="email" autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <p-password inputId="password" name="password" [(ngModel)]="password"
                        [toggleMask]="true" required
                        promptLabel="Choose a strong password"
                        weakLabel="Weak" mediumLabel="Medium" strongLabel="Strong"></p-password>
          </div>

          <p-button label="Create Workspace" icon="pi pi-user-plus" type="submit"
                    class="submit" [loading]="submitting()"
                    [disabled]="!f.valid"></p-button>
        </form>

        <div class="hint">
          You'll be the first <strong>Admin</strong> of this workspace. Invite teammates from the dashboard.
        </div>

        <div class="foot">
          Already have a workspace? <a routerLink="/login">Login</a>
        </div>
      </ng-template>
    </p-card>

    <div class="back-home"><a routerLink="/">&larr; Back to home</a></div>
  </div>
</div>
