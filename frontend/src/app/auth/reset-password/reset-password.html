<div class="shell">
  <div class="card-wrap">
    <div class="brand">
      <span class="brand-mark">T</span>
      <span>Tracker</span>
    </div>

    <p-card class="auth-card">
      <ng-template #title>Set a new password</ng-template>
      <ng-template #subtitle>Choose something strong &mdash; at least 8 characters.</ng-template>
      <ng-template #content>
        @if (error()) { <div class="alert">{{ error() }}</div> }
        @if (message()) { <div class="alert alert-success">{{ message() }}</div> }

        <form (ngSubmit)="submit()" #f="ngForm">
          <div class="field">
            <label for="password">New password</label>
            <p-password inputId="password" name="password" [(ngModel)]="password"
                        [toggleMask]="true" required></p-password>
          </div>

          <p-button label="Reset password" icon="pi pi-check" type="submit"
                    class="submit" [loading]="submitting()"
                    [disabled]="!f.valid || !token"></p-button>
        </form>

        <div class="foot">
          Back to <a routerLink="/login">login</a>
        </div>
      </ng-template>
    </p-card>

    <div class="back-home"><a routerLink="/">&larr; Back to home</a></div>
  </div>
</div>
